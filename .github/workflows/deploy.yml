name: Check

# Publishing is done by Cloudflare Workers Builds, which is connected to this
# repository and deploys every push to main. This workflow only checks pull
# requests and pushes, so it needs no Cloudflare secrets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same order as `npm run check`: binding types, typecheck, tests, build, dry-run.
      - name: Generate Worker binding types
        run: npm run cf:typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build public assets
        run: npm run build

      - name: Wrangler dry-run
        run: npm run deploy:dry-run

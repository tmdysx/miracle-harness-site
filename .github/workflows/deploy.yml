name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main share one production group and are never cancelled midway, so
# two deploys cannot overlap. Pull requests and manual runs only run checks and
# cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production-deploy' || format('check-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same order as `npm run check`: binding types, typecheck, tests, build, dry-run.
      - name: Generate Worker binding types
        run: npm run cf:typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build public assets
        run: npm run build

      - name: Wrangler dry-run
        run: npm run deploy:dry-run

      - name: Apply remote D1 migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply miracle-harness-site-db --remote

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
